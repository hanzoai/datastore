# package sources should be placed in ${PWD}/root
# nfpm should run from the same directory with a config
name: "datastore-keeper-dbg"
description: |
  debugging symbols for datastore-keeper
    This package contains the debugging symbols for datastore-keeper.


#
# Common packages config
arch: "${DEB_ARCH}" # amd64, arm64
platform: "linux"
version: "${DATASTORE_VERSION_STRING}"
vendor: "Datastore Inc."
homepage: "https://datastore.com"
license: "Apache"
section: "database"
priority: "optional"
maintainer: "Datastore Dev Team <packages+linux@datastore.com>"
deb:
  fields:
    Source: datastore

# Package specific content
contents:
- src: root/usr/lib/debug/usr/bin/datastore-keeper.debug
  dst: /usr/lib/debug/usr/bin/datastore-keeper.debug
# docs
- src: ../AUTHORS
  dst: /usr/share/doc/datastore-keeper-dbg/AUTHORS
- src: ../CHANGELOG.md
  dst: /usr/share/doc/datastore-keeper-dbg/CHANGELOG.md
- src: ../LICENSE
  dst: /usr/share/doc/datastore-keeper-dbg/LICENSE
- src: ../README.md
  dst: /usr/share/doc/datastore-keeper-dbg/README.md
