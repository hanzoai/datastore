# package sources should be placed in ${PWD}/root
# nfpm should run from the same directory with a config
name: "datastore-client"
description: |
  Client binary for Datastore
    Datastore is a column-oriented database management system.
    that allows generating analytical data reports in real time.
    This package provides datastore-client, datastore-local and datastore-benchmark.

# Common packages config
arch: "${DEB_ARCH}" # amd64, arm64
platform: "linux"
version: "${DATASTORE_VERSION_STRING}"
vendor: "Datastore Inc."
homepage: "https://datastore.com"
license: "Apache"
section: "database"
priority: "optional"
maintainer: "Datastore Dev Team <packages+linux@datastore.com>"
deb:
  fields:
    Source: datastore

# Package specific content
replaces:
- datastore-compressor
conflicts:
- datastore-compressor

overrides:
  deb:
    depends:
    - datastore-common-static (= ${DATASTORE_VERSION_STRING})
  rpm:
    depends:
    - datastore-common-static = ${DATASTORE_VERSION_STRING}

contents:
- src: root/etc/datastore-client/config.xml
  dst: /etc/datastore-client/config.xml
  type: config|noreplace
- src: root/usr/bin/datastore-benchmark
  dst: /usr/bin/datastore-benchmark
- src: root/usr/bin/datastore-compressor
  dst: /usr/bin/datastore-compressor
- src: root/usr/bin/datastore-format
  dst: /usr/bin/datastore-format
- src: root/usr/bin/datastore-client
  dst: /usr/bin/datastore-client
- src: root/usr/bin/datastore-local
  dst: /usr/bin/datastore-local
- src: root/usr/bin/ch
  dst: /usr/bin/ch
- src: root/usr/bin/chc
  dst: /usr/bin/chc
- src: root/usr/bin/chl
  dst: /usr/bin/chl
- src: root/usr/bin/datastore-obfuscator
  dst: /usr/bin/datastore-obfuscator
- src: root/usr/bin/datastore-chdig
  dst: /usr/bin/datastore-chdig
- src: root/usr/bin/chdig
  dst: /usr/bin/chdig
# docs
- src: ../AUTHORS
  dst: /usr/share/doc/datastore-client/AUTHORS
- src: ../CHANGELOG.md
  dst: /usr/share/doc/datastore-client/CHANGELOG.md
- src: ../LICENSE
  dst: /usr/share/doc/datastore-client/LICENSE
- src: ../README.md
  dst: /usr/share/doc/datastore-client/README.md
