# package sources should be placed in ${PWD}/root
# nfpm should run from the same directory with a config
name: "datastore-common-static-dbg"
description: |
  debugging symbols for datastore-common-static
    This package contains the debugging symbols for datastore-common.


#
# Common packages config
arch: "${DEB_ARCH}" # amd64, arm64
platform: "linux"
version: "${DATASTORE_VERSION_STRING}"
vendor: "Datastore Inc."
homepage: "https://datastore.com"
license: "Apache"
section: "database"
priority: "optional"
maintainer: "Datastore Dev Team <packages+linux@datastore.com>"
deb:
  fields:
    Source: datastore

# Package specific content
replaces:
- datastore-common-dbg
conflicts:
- datastore-common-dbg

contents:
- src: root/usr/lib/debug/usr/bin/datastore.debug
  dst: /usr/lib/debug/usr/bin/datastore.debug
# docs
- src: ../AUTHORS
  dst: /usr/share/doc/datastore-common-static-dbg/AUTHORS
- src: ../CHANGELOG.md
  dst: /usr/share/doc/datastore-common-static-dbg/CHANGELOG.md
- src: ../LICENSE
  dst: /usr/share/doc/datastore-common-static-dbg/LICENSE
- src: ../README.md
  dst: /usr/share/doc/datastore-common-static-dbg/README.md
