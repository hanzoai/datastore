services:
    zoo1:
        image: ${image:-datastore/integration-test}
        stop_grace_period: 5s
        restart: always
        user: ${user:-}
        volumes:
            - type: bind
              source: ${keeper_binary:-}
              target: /usr/bin/datastore
            - type: bind
              source: ${keeper_binary:-}
              target: /usr/bin/datastore-keeper
            - type: bind
              source: ${keeper_config_dir1:-}
              target: /etc/datastore-keeper
            - type: bind
              source: ${keeper_logs_dir1:-}
              target: /var/log/datastore-keeper
            - type: ${keeper_fs:-tmpfs}
              source: ${keeper_db_dir1:-}
              target: /var/lib/datastore-keeper
            - type: ${keeper_fs:-tmpfs}
              source: ${keeper_db_dir1:-}
              target: /var/lib/datastore
        entrypoint: "${keeper_cmd_prefix:-datastore keeper} --config=/etc/datastore-keeper/keeper_config1.xml --log-file=/var/log/datastore-keeper/datastore-keeper.log --errorlog-file=/var/log/datastore-keeper/datastore-keeper.err.log"
        cap_add:
            - SYS_PTRACE
            - NET_ADMIN
            - IPC_LOCK
            - SYS_NICE
        security_opt:
            - label:disable
            - seccomp:unconfined
        dns_opt:
            - attempts:2
            - timeout:1
            - inet6
            - rotate
        cpus: 3
    zoo2:
        image: ${image:-datastore/integration-test}
        stop_grace_period: 5s
