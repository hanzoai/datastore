openSSL:
  server:
    certificateFile: '/etc/datastore-server/config.d/first.crt'
    privateKeyFile: '/etc/datastore-server/config.d/first.key'
    caConfig: '/etc/datastore-server/config.d/rootCA.pem'
    loadDefaultCAFile: false
    verificationMode: 'relaxed'
    cacheSessions: true
    disableProtocols: 'sslv2,sslv3'
    preferServerCiphers: true
  client:
    certificateFile: '/etc/datastore-server/config.d/first.crt'
    privateKeyFile: '/etc/datastore-server/config.d/first.key'
    caConfig: '/etc/datastore-server/config.d/rootCA.pem'
    loadDefaultCAFile: false
    verificationMode: 'relaxed'
    cacheSessions: true
    disableProtocols: 'sslv2,sslv3'
    preferServerCiphers: true
