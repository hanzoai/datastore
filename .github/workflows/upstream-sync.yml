# Periodic upstream sync from ClickHouse/ClickHouse. Same pattern as hanzo/dev's
# upstream-sync.yml. Auto-merge on clean, issue-on-conflict.
#
# Hanzo-side overlays (`hanzo/`, `cmd/zap-bridge/`, `Dockerfile.hanzo`) are
# disjoint from upstream paths, so most syncs land clean. Conflicts are
# flagged for human resolution; the bot does not touch content.

name: upstream-sync

on:
  schedule:
    - cron: '0 6 * * *'    # daily — ClickHouse moves slower than codex
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: 'Upstream ClickHouse branch'
        required: false
        default: 'master'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: configure git
        run: |
          git config user.name 'hanzo-upstream-sync[bot]'
          git config user.email 'hanzo-upstream-sync@users.noreply.github.com'

      - name: fetch upstream ClickHouse
        env:
          UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || 'master' }}
        run: |
          git remote add upstream https://github.com/ClickHouse/ClickHouse.git
          git fetch upstream "$UPSTREAM_BRANCH" --tags --no-recurse-submodules

      - name: short-circuit if in sync
        id: sync_check
        env:
          UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || 'master' }}
        run: |
          BEHIND=$(git rev-list --count "main..upstream/$UPSTREAM_BRANCH")
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"

      - name: prepare merge branch
        if: steps.sync_check.outputs.behind != '0'
        run: |
          BRANCH="merge-upstream-$(date -u +%Y%m%d-%H%M%S)"
          echo "MERGE_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH" main

      - name: attempt merge
        id: merge
        if: steps.sync_check.outputs.behind != '0'
        env:
          UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || 'master' }}
        run: |
          set +e
          git merge --no-edit "upstream/$UPSTREAM_BRANCH" -m "merge upstream ClickHouse/$UPSTREAM_BRANCH"
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            git merge --abort
            git checkout main
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            echo "conflicts=$CONFLICTS" >> "$GITHUB_OUTPUT"
          else
            echo "status=clean" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: push + open PR (clean)
        if: steps.merge.outputs.status == 'clean'
        run: git push origin "$MERGE_BRANCH"

      - name: open PR (clean)
        if: steps.merge.outputs.status == 'clean'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.MERGE_BRANCH }}
          base: main
          title: 'sync: upstream ClickHouse (clean)'
          body: |
            Automated upstream ClickHouse sync. Merge produced no conflicts.
            Behind by ${{ steps.sync_check.outputs.behind }} commits.
          labels: upstream-sync, automerge

      - name: open issue (conflict)
        if: steps.merge.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "upstream-sync: ClickHouse conflict on $(date -u +%Y-%m-%d)" \
            --label upstream-sync,conflict \
            --body "Automated upstream sync hit conflicts. Behind ${{ steps.sync_check.outputs.behind }} commits. Conflicting paths:\n\n\`\`\`\n${{ steps.merge.outputs.conflicts }}\n\`\`\`"
