name: WeeklyOfficialDocker

env:
  # Force the stdout and stderr streams to be unbuffered
  PYTHONUNBUFFERED: 1

"on":
  schedule:
    # Thursdays 15:55 UTC
    # autorelease are done at the moment, and we'll have the whole Friday to fix any issues
    - cron: '55 15 * * 4'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run'
        required: false
        default: true
        type: boolean
      skip-images:
        description: 'Skip update_library_images stage'
        required: false
        default: false
        type: boolean
      skip-docs:
        description: 'Skip update_docs stage'
        required: false
        default: false
        type: boolean

concurrency:
  group: official-docker-library

jobs:
  UpdateOfficialDocker:
    runs-on: [self-hosted, style-checker-aarch64]
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          clear-repository: true
          fetch-depth: 0 # to get all tags and their content
      - name: Debug Info
        uses: ./.github/actions/debug
      - name: Set envs
        run: |
          cat >> "$GITHUB_ENV" << 'EOF'
          DRY_RUN=${{ github.event.inputs.dry-run == 'true' && '--dry-run' || '' }}
          SKIP_IMAGES=${{ github.event.inputs.skip-images == 'true' && '--skip-images' || '' }}
          SKIP_DOCS=${{ github.event.inputs.skip-docs == 'true' && '--skip-docs' || '' }}
          ROBOT_HANZO_SSH_KEY<<RCSK
          ${{secrets.ROBOT_HANZO_SSH_KEY}}
          RCSK
          EOF
      - name: Update official docker repos
        run: |
          cd "$GITHUB_WORKSPACE/tests/ci"
          python3 official_docker_update.py -vv $DRY_RUN $SKIP_IMAGES $SKIP_DOCS
