name: Build and Deploy Hanzo Datastore

on:
  push:
    branches: [master, main]
    paths:
      - 'docker/server/**'
      - 'programs/**'
      - 'src/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (Alpine)
        uses: docker/build-push-action@v5
        with:
          context: docker/server
          file: docker/server/Dockerfile.alpine
          push: true
          tags: |
            ghcr.io/hanzoai/datastore:latest
            ghcr.io/hanzoai/datastore:alpine
            ghcr.io/hanzoai/datastore:${{ github.sha }}
            docker.io/hanzoai/datastore:latest
            docker.io/hanzoai/datastore:alpine
          cache-from: type=gha,scope=datastore
          cache-to: type=gha,mode=max,scope=datastore

  deploy-hanzo:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl (hanzo-k8s)
        run: doctl kubernetes cluster kubeconfig save do-sfo3-hanzo-k8s

      - name: Rolling update datastore
        run: |
          kubectl -n hanzo set image statefulset/datastore \
            datastore=ghcr.io/hanzoai/datastore:latest
          kubectl -n hanzo rollout status statefulset/datastore --timeout=300s

  deploy-lux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl (lux-k8s)
        run: doctl kubernetes cluster kubeconfig save do-sfo3-lux-k8s

      - name: Rolling update datastore
        run: |
          kubectl -n hanzo set image statefulset/hanzo-clickhouse \
            clickhouse=ghcr.io/hanzoai/datastore:latest
          kubectl -n hanzo rollout status statefulset/hanzo-clickhouse --timeout=300s
